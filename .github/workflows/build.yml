name: Sestavení

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Testy GEDCOM
        run: ./gradlew :gedcom:test

      - name: Sestavení APK
        run: ./gradlew :app:assembleDebug :app:assembleRelease :app:lintDebug

      - name: Přejmenování APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/moje-koreny-${{ github.run_number }}.apk
          cp app/build/outputs/apk/debug/app-debug.apk out/moje-koreny-${{ github.run_number }}-ladici.apk

      - uses: actions/upload-artifact@v4
        with:
          name: moje-koreny-apk
          path: out/*.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reporty
          path: |
            gedcom/build/reports/tests/
            app/build/reports/lint-results-debug.html

      - name: Vydání (jen pro značku v…)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/moje-koreny-${{ github.run_number }}.apk
